# Builds FormBuddy.exe from source, in the open, on GitHub's runners.
#
# SignPath will only sign artefacts that come out of an automated build of the
# published source, so this workflow is the thing that makes the signature
# mean something: what gets signed is provably what is in this repository.

name: build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - name: Check out the source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install what the program needs
        run: |
          python -m pip install --upgrade pip
          python -m pip install uiautomation pystray pillow cryptography pyinstaller

      - name: Build FormBuddy.exe
        run: >
          python -m PyInstaller
          --onefile
          --noconsole
          --noupx
          --name FormBuddy
          --icon source/formbuddy.ico
          --version-file source/version_info.txt
          --exclude-module numpy
          --exclude-module cv2
          --exclude-module matplotlib
          --exclude-module pandas
          --exclude-module scipy
          source/FormBuddy.py

      - name: Record the checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash dist/FormBuddy.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  FormBuddy.exe" | Out-File -Encoding ascii dist/SHA256SUMS.txt
          Write-Host "SHA256: $hash"

      - name: Check the build carries the right identity
        shell: pwsh
        run: |
          $v = (Get-Item dist/FormBuddy.exe).VersionInfo
          Write-Host "CompanyName: $($v.CompanyName)"
          Write-Host "ProductName: $($v.ProductName)"
          Write-Host "FileVersion: $($v.FileVersion)"
          if ($v.CompanyName -ne "Torigan") { throw "version resource missing" }

      - name: Upload the build
        uses: actions/upload-artifact@v4
        with:
          name: FormBuddy-windows
          path: |
            dist/FormBuddy.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error
