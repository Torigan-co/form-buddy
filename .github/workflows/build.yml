# Builds FormBuddy.exe from source, in the open, on GitHub's runners, and
# publishes it as a release when a version tag is pushed.
#
# SignPath will only sign artefacts that come out of an automated build of the
# published source, so this workflow is the thing that makes the signature
# mean something: what gets signed is provably what is in this repository.

name: build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write        # needed to create the release

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - name: Check out the source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install what the program needs
        run: |
          python -m pip install --upgrade pip
          python -m pip install uiautomation pystray pillow cryptography pyinstaller

      - name: Build FormBuddy.exe
        run: >
          python -m PyInstaller
          --onefile
          --noconsole
          --noupx
          --name FormBuddy
          --icon source/formbuddy.ico
          --version-file source/version_info.txt
          --exclude-module numpy
          --exclude-module cv2
          --exclude-module matplotlib
          --exclude-module pandas
          --exclude-module scipy
          source/FormBuddy.py

      - name: Record the checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash dist/FormBuddy.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  FormBuddy.exe" | Out-File -Encoding ascii dist/SHA256SUMS.txt
          Write-Host "SHA256: $hash"

      - name: Check the build carries the right identity
        shell: pwsh
        run: |
          $v = (Get-Item dist/FormBuddy.exe).VersionInfo
          Write-Host "CompanyName: $($v.CompanyName)"
          Write-Host "ProductName: $($v.ProductName)"
          Write-Host "FileVersion: $($v.FileVersion)"
          if ($v.CompanyName -ne "Torigan") { throw "version resource missing" }

      - name: Check nothing personal was baked in
        shell: pwsh
        run: |
          $bytes = [IO.File]::ReadAllBytes("dist/FormBuddy.exe")
          $text = [Text.Encoding]::ASCII.GetString($bytes)
          foreach ($probe in @("Sameera", "virajofficialinfo", "+94 77 581")) {
            if ($text.Contains($probe)) { throw "personal data found in build: $probe" }
          }
          Write-Host "clean"

      - name: Upload the build
        uses: actions/upload-artifact@v4
        with:
          name: FormBuddy-windows
          path: |
            dist/FormBuddy.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Form Buddy ${{ github.ref_name }}
          files: |
            dist/FormBuddy.exe
            dist/SHA256SUMS.txt
          generate_release_notes: true
          body: |
            **Fill any form on Windows with two taps of `Alt`.**

            Download `FormBuddy.exe` below and double-click it. No installer,
            no account, nothing to set up.

            ### Verify what you downloaded

            ```powershell
            Get-FileHash .\FormBuddy.exe -Algorithm SHA256
            ```

            Compare it with `SHA256SUMS.txt` attached to this release. This
            binary was built by GitHub Actions from the source in this
            repository — the build log is public.

            ### Windows will warn you

            The file is not code-signed yet, so Windows shows *"unknown
            publisher"*. Click **More info**, then **Run anyway**. Please do
            not disable your antivirus. The reasons are explained in full in
            the [README](https://github.com/Torigan-co/form-buddy#windows-will-warn-you-the-first-time),
            and free code signing is being arranged through
            [SignPath Foundation](https://signpath.org).

            ### Privacy

            Form Buddy collects nothing. There is no network code in it at
            all. See [PRIVACY.md](https://github.com/Torigan-co/form-buddy/blob/main/PRIVACY.md).
